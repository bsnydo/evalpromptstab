[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bsnydo-evalpromptstab"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出评测提示的稳定性上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bsnydo" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bsnydo.github.io"
Repository = "https://github.com/bsnydo/evalpromptstab"
Issues = "https://github.com/bsnydo/evalpromptstab/issues"

[project.scripts]
evalpromptstab = "evalpromptstab:main"

[tool.setuptools]
py-modules = ["evalpromptstab"]
